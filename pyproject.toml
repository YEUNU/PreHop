[project]
name = "prehop"
version = "0.0.0"
description = "Offline HOP-edge pre-scoring for deterministic multi-hop retrieval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "neo4j",
    "openai",
    "numpy",
    "typing_extensions>=4.13.0",
    "httpx",
    "pydantic",
    "loguru",
    "python-dotenv",
    "matplotlib",
    "tqdm",
    "requests",
    "tiktoken",
    "pyarrow",  # parses HuggingFace parquet dataset exports (data/prepare_*.py)
    "spacy",  # sentence/entity splitting for the hoprag baseline's official indexer
    "pandas",  # third_party/HopRAG/HopBuilder.py (official hoprag baseline);
               # also a dep of the ms_graphrag baseline
    "graphrag",  # official ms_graphrag baseline (models/ms_graphrag/official_indexer.py,
                 # ms_adapter.py) — pulls the graphrag_cache/input/llm/storage/vectors
                 # submodules those files import
    "litellm",  # ms_graphrag baseline routes generation through a LiteLLM Router
                # (models/ms_graphrag/official_indexer.py, ms_adapter.py)
    # paddlenlp/modelscope/sentence-transformers are NOT needed:
    # third_party/HopRAG/tool.py imports them
    # at module level, but models/hoprag/official_indexer.py installs import-only
    # sentinels before that import. Any accidental runtime use raises loudly;
    # the real packages are not part of the supported indexing/benchmark path.
]

[project.optional-dependencies]
# Test/dev tooling. Install with: VIRTUAL_ENV=.venv uv pip install -e ".[dev]"
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

# The repo is a flat-layout collection of top-level dirs (cli/core/models/
# utils/...) run via `python main.py` from the repo root (main.py does
# sys.path.append), not an importable distribution. Declare no top-level
# modules so setuptools doesn't auto-discover them and abort the editable
# build with "Multiple top-level packages discovered in a flat-layout".
[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 120
extend-exclude = ["third_party"]

[tool.ruff.lint]
# E402: main.py needs sys.path.append before local imports
# F403: utils/prompts/__init__.py uses wildcard re-export by design
per-file-ignores = { "main.py" = ["E402"], "utils/prompts/__init__.py" = ["F403"] }

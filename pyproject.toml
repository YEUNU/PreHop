[project]
name = "prehop"
version = "0.0.0"
description = "Question-linked passage graphs and LLM reranking for multi-hop retrieval-augmented generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "neo4j",
    "openai",
    "numpy",
    "typing_extensions>=4.13.0",
    "httpx",
    "pydantic",
    "python-dotenv",
    "matplotlib",
    "requests",
    "tiktoken",
    # Generation and embeddings use the configured external LiteLLM gateway.
]

[project.optional-dependencies]
# Test/dev tooling: uv sync --locked --python 3.12 --extra dev
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

# Run the CLI from the repository root; no importable distribution is built.
# Explicit discovery keeps the flat cli/core/models/utils layout supported.
[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 120
extend-exclude = ["third_party"]

[tool.ruff.lint]
# E402: main.py needs sys.path.append before local imports
# F403: utils/prompts/__init__.py uses wildcard re-export by design
per-file-ignores = { "main.py" = ["E402"], "utils/prompts/__init__.py" = ["F403"] }
